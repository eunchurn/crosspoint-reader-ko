name: Compile Release
on:
  push:
    tags:
    - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: false

    - name: Install PlatformIO Core
      run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip esptool

    - name: Set version from tag
      run: |
        sed -i "s/^crosspoint_version = .*/crosspoint_version = ${{ github.ref_name }}/" platformio.ini

    - name: Build CrossPoint
      run: pio run -e gh_release

    - name: Merge firmware binaries
      run: |
        esptool.py --chip esp32c3 merge_bin \
          -o .pio/build/gh_release/CrossPoint-${{ github.ref_name }}.bin \
          --flash_mode dio \
          --flash_freq 80m \
          --flash_size 16MB \
          0x0 .pio/build/gh_release/bootloader.bin \
          0x8000 .pio/build/gh_release/partitions.bin \
          0x10000 .pio/build/gh_release/firmware.bin

    # ─── OTA signature: appends [64B Ed25519 sig][4B 'CPSG'] to firmware.bin ───
    # Runs AFTER merge_bin so the merged full-flash image (CrossPoint-*.bin)
    # contains the unsigned firmware — full reflash bypasses our verifier
    # anyway. The standalone firmware.bin asset is what OTA downloads, and
    # that is the file we sign.
    - name: Install signing dependencies
      run: uv pip install --system cryptography

    - name: Sign firmware.bin for OTA
      env:
        ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
      run: |
        if [ -z "$ED25519_PRIVATE_KEY" ]; then
          echo "::error::ED25519_PRIVATE_KEY secret is not set — refusing to release an unsigned firmware.bin."
          exit 1
        fi
        python scripts/sign_firmware.py .pio/build/gh_release/firmware.bin

    - name: Verify firmware.bin signature (self-check)
      run: |
        python scripts/verify_firmware_signature.py \
          .pio/build/gh_release/firmware.bin --embedded

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CrossPoint-${{ github.ref_name }}
        path: |
          .pio/build/gh_release/bootloader.bin
          .pio/build/gh_release/firmware.bin
          .pio/build/gh_release/firmware.elf
          .pio/build/gh_release/firmware.map
          .pio/build/gh_release/partitions.bin

    - name: Create Release with Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          .pio/build/gh_release/CrossPoint-${{ github.ref_name }}.bin
          .pio/build/gh_release/firmware.bin
          .pio/build/gh_release/bootloader.bin
          .pio/build/gh_release/partitions.bin
        generate_release_notes: false
        draft: false
        prerelease: false

    - name: Trigger docs deployment
      continue-on-error: true
      run: gh workflow run deploy.yml -R crosspoint-reader-ko/crosspoint-reader-docs
      env:
        GH_TOKEN: ${{ secrets.CROSSPOINT_ACTION_TOKEN }}
